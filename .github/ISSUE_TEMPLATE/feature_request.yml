name: Feature request
description: Propose a focused improvement to CGRX
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible behavior and boundaries.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / correctness considerations
      description: Note expected effects on graph evidence, ambiguity, or coverage gaps.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

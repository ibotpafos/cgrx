name: Feature proposal
description: Propose one bounded, evidence-backed CGRX improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the implementation idea.
        Do not submit credentials, production logs, private source, or unredacted repository data.
  - type: input
    id: version
    attributes:
      label: CGRX version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or client
      placeholder: Codex on macOS, OpenCode on Linux, or not platform-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Reproducible user problem
      description: Show the current workflow with a minimal synthetic or public example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result or current limitation
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Relevant coverage status
      description: State known coverage gaps or write "Not a graph relationship change".
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I verified that this proposal contains no private repository source or sensitive data.
          required: true

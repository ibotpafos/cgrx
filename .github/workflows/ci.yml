name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: node --version | grep -E '^v26\.'
      - run: |
          npm ci
          npm run typecheck:web
          npm run build:web-vendor
          git diff --exit-code -- crates/cgrx-cli/web/vendor/
          npm run verify:web-csp
          npm test

  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p cgrx-cli

  integration:
    needs: [rust-core]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
      - run: cargo build --locked --release -p cgrx-cli
      - run: python3 scripts/smoke_mcp.py target/release/cgrx
      - run: python3 scripts/smoke_scopes.py target/release/cgrx
      - run: python3 scripts/eval_relationships.py target/release/cgrx
      - run: python3 scripts/eval_change_missions.py target/release/cgrx
      - run: python3 scripts/eval_change_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_repository_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_mistake_ledger.py target/release/cgrx --warn-only
      - name: Run repository quality gate
        run: |
          target/release/cgrx ci --repo . --format github --gate repository \
            --allow-inconclusive-within-budgets \
            --max-package-fan-out 92 \
            --max-symbol-fan-in 144 \
            --max-unresolved-local-dependencies 83 \
            --repository-max-coverage-gaps 18289
      - name: Materialize pull-request changes against the base revision
        if: github.event_name == 'pull_request'
        env:
          CGRX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git reset --mixed "$CGRX_BASE_SHA"
      - name: Run pull-request change quality gate
        if: github.event_name == 'pull_request'
        run: |
          target/release/cgrx ci --repo . --format github --gate change \
            --allow-inconclusive-within-budgets \
            --max-blocked-missions 19 \
            --max-coverage-gaps 26 \
            --max-unverified-impacts 1
      - name: Relationship evaluator integrity and real MCP fanout
        run: CGRX_EVAL_BINARY=target/release/cgrx python3 -m unittest discover -s scripts -p test_eval_relationships.py
      - name: Refactor evaluator integrity
        run: python3 -m unittest discover -s scripts -p test_eval_refactors.py
      - name: Architecture planner integrity
        run: python3 -m unittest discover -s scripts -p test_benchmark_architecture.py

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p test_install.py
      - run: python3 -m unittest discover -s scripts -p test_eval_agent_tasks.py
      - run: python3 -m unittest discover -s scripts -p 'test_validate_*.py'

name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: node --version | grep -E '^v26\.'
      - run: |
          npm ci
          npm run typecheck:web
          npm run build:web
          git diff --exit-code -- crates/cgrx-cli/web/app.js crates/cgrx-cli/web/layout-worker.bundle.js crates/cgrx-cli/web/topology-worker.bundle.js
          npm run build:web-vendor
          git diff --exit-code -- crates/cgrx-cli/web/vendor/
          npm run verify:web-csp
          npm test

  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-${{ matrix.os }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - name: Validate opt-in Swift evidence without changing the default registry
        run: |
          cargo clippy --locked --workspace --all-targets --features cgrx-cli/experimental-swift -- -D warnings
          cargo test --locked --workspace --features cgrx-cli/experimental-swift --no-fail-fast
      - run: cargo build --locked --release -p cgrx-cli
      - name: Upload integration binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgrx-${{ matrix.os }}
          path: target/release/cgrx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  integration:
    needs: [rust-core]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download integration binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cgrx-${{ matrix.os }}
          path: target/release
      - run: chmod +x target/release/cgrx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scripts/mcp-contract/package-lock.json
      - name: Install pinned MCP contract client
        run: npm ci --prefix scripts/mcp-contract --ignore-scripts --no-audit --no-fund
      - name: Validate every MCP tool in full and token-efficient profiles
        run: |
          node scripts/mcp-contract/run.mjs target/release/cgrx
          node scripts/mcp-contract/project-checks.mjs target/release/cgrx full
          node scripts/mcp-contract/project-checks.mjs target/release/cgrx token-efficient
      - run: python3 scripts/smoke_mcp.py target/release/cgrx
      - name: Native MCP resource lifecycle and 24-session regression
        run: CGRX_TEST_BINARY=target/release/cgrx python3 -m unittest discover -s scripts -p test_mcp_resources.py
      - run: python3 scripts/smoke_scopes.py target/release/cgrx
      - name: Validate code discovery and complete compact search pages
        run: python3 scripts/eval_search_discovery.py target/release/cgrx
      - run: python3 scripts/eval_relationships.py target/release/cgrx
      - run: python3 scripts/eval_change_missions.py target/release/cgrx
      - run: python3 scripts/eval_change_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_repository_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_mistake_ledger.py target/release/cgrx --warn-only
      - name: Relationship evaluator integrity and real MCP fanout
        run: CGRX_EVAL_BINARY=target/release/cgrx python3 -m unittest discover -s scripts -p test_eval_relationships.py
      - name: Refactor evaluator integrity
        run: python3 -m unittest discover -s scripts -p test_eval_refactors.py
      - name: Architecture planner integrity
        run: python3 -m unittest discover -s scripts -p test_benchmark_architecture.py

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git diff --check
      - run: python3 -m unittest discover -s scripts -p test_install.py
      - run: python3 -m unittest discover -s scripts -p 'test_validate_*.py'


  release-candidate:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release metadata
        run: python3 scripts/test_validate_release.py
      - name: Install pinned Rust target
        run: rustup toolchain install 1.89.0 --profile minimal --target aarch64-apple-darwin
      - name: Build exact Apple Silicon release candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked --release -p cgrx-cli --target aarch64-apple-darwin
          binary=target/aarch64-apple-darwin/release/cgrx
          file "$binary" | grep -E 'arm64|aarch64'
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          asset="cgrx-$version-aarch64-apple-darwin.tar.gz"
          tar -czf "$asset" -C target/aarch64-apple-darwin/release cgrx
          shasum -a 256 "$asset" > SHA256SUMS
          tar -tzf "$asset" | grep -Fx cgrx
          test -s SHA256SUMS

  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: npm
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked -p cgrx-cli
      - run: npx playwright test

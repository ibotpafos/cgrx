name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: node --version | grep -E '^v26\.'
      - run: |
          npm ci
          npm run typecheck:web
          npm run build:web-vendor
          git diff --exit-code -- crates/cgrx-cli/web/vendor/
          npm run verify:web-csp
          npm test

  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-${{ matrix.os }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo build --locked --release -p cgrx-cli
      - name: Upload integration binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgrx-${{ matrix.os }}
          path: target/release/cgrx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  integration:
    needs: [rust-core]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download integration binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cgrx-${{ matrix.os }}
          path: target/release
      - run: chmod +x target/release/cgrx
      - run: python3 scripts/smoke_mcp.py target/release/cgrx
      - run: python3 scripts/smoke_scopes.py target/release/cgrx
      - run: python3 scripts/eval_relationships.py target/release/cgrx
      - run: python3 scripts/eval_change_missions.py target/release/cgrx
      - run: python3 scripts/eval_change_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_repository_quality_gates.py target/release/cgrx
      - run: python3 scripts/eval_mistake_ledger.py target/release/cgrx --warn-only
      - name: Relationship evaluator integrity and real MCP fanout
        run: CGRX_EVAL_BINARY=target/release/cgrx python3 -m unittest discover -s scripts -p test_eval_relationships.py
      - name: Refactor evaluator integrity
        run: python3 -m unittest discover -s scripts -p test_eval_refactors.py
      - name: Architecture planner integrity
        run: python3 -m unittest discover -s scripts -p test_benchmark_architecture.py

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p test_install.py
      - run: python3 -m unittest discover -s scripts -p 'test_validate_*.py'


  release-candidate:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release metadata
        run: python3 scripts/test_validate_release.py
      - name: Install pinned Rust target
        run: rustup toolchain install 1.89.0 --profile minimal --target aarch64-apple-darwin
      - name: Build exact Apple Silicon release candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 build --locked --release -p cgrx-cli --target aarch64-apple-darwin
          binary=target/aarch64-apple-darwin/release/cgrx
          file "$binary" | grep -E 'arm64|aarch64'
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          asset="cgrx-$version-aarch64-apple-darwin.tar.gz"
          tar -czf "$asset" -C target/aarch64-apple-darwin/release cgrx
          shasum -a 256 "$asset" > SHA256SUMS
          tar -tzf "$asset" | grep -Fx cgrx
          test -s SHA256SUMS

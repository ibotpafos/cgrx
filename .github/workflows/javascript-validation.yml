name: JavaScript validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-validation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  javascript-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: javascript-validation-${{ matrix.os }}
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p test_eval_curated_index.py
      - run: cargo clippy --locked --workspace --all-targets --features cgrx-cli/experimental-javascript -- -D warnings
      - run: cargo test --locked --workspace --features cgrx-cli/experimental-javascript --no-fail-fast
      - name: Verify dependency-only feature unification cannot reuse the default cache
        run: |
          cargo test --locked -p cgrx-cli --features cgrx-languages/experimental-javascript --test javascript_policy
          cargo test --locked -p cgrx-cli --features cgrx-languages/experimental-javascript --lib javascript_proofs_require
      - run: cargo build --locked --release -p cgrx-cli --features experimental-javascript

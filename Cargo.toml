[workspace]
resolver = "3"
members = [
  "crates/cgrx-core",
  "crates/cgrx-store",
  "crates/cgrx-languages",
  "crates/cgrx-retrieval",
  "crates/cgrx-capsule",
  "crates/cgrx-cgcr",
  "crates/cgrx-mcp",
  "crates/cgrx-cli",
  "crates/cgrx-metrics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ibotpafos/cgrx"

[workspace.dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
cgrx-capsule = { path = "crates/cgrx-capsule" }
cgrx-cgcr = { path = "crates/cgrx-cgcr" }
cgrx-core = { path = "crates/cgrx-core" }
cgrx-languages = { path = "crates/cgrx-languages" }
cgrx-mcp = { path = "crates/cgrx-mcp" }
cgrx-metrics = { path = "crates/cgrx-metrics" }
cgrx-retrieval = { path = "crates/cgrx-retrieval" }
cgrx-store = { path = "crates/cgrx-store" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

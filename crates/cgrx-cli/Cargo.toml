[package]
name = "cgrx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "cgrx"
path = "src/main.rs"

[dependencies]
similar = "=3.2.1"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }
cgrx-capsule.workspace = true
cgrx-core.workspace = true
cgrx-cgcr.workspace = true
cgrx-languages.workspace = true
cgrx-mcp.workspace = true
cgrx-retrieval.workspace = true
cgrx-store.workspace = true
cgrx-metrics.workspace = true
blake3.workspace = true
sha2 = "=0.11.1"
base64 = "=0.23.1"
ast-grep-core = "=0.45.2"
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
rayon = "=1.12.0"
levenshtein = "1.0.5"
serde.workspace = true
serde_json.workspace = true
notify = "8.2.0"
protobuf = "=3.7.2"
scip = "=0.10.0"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[[test]]
name = "multi_repo"
path = "../../tests/multi_repo.rs"

[features]
# Validation-only opt-in; never enabled by a default or release build.
experimental-php = ["cgrx-languages/experimental-php"]
# Backward-compatible alias; Swift is enabled in every build.
experimental-swift = ["cgrx-languages/experimental-swift"]
experimental-javascript = ["cgrx-languages/experimental-javascript"]

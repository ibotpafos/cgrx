[package]
name = "cgrx-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "cgrx"
path = "src/main.rs"

[dependencies]
toml = { version = "=1.1.6", default-features = false, features = ["parse"] }
cgrx-capsule.workspace = true
cgrx-core.workspace = true
cgrx-cgcr.workspace = true
cgrx-languages.workspace = true
cgrx-mcp.workspace = true
cgrx-retrieval.workspace = true
cgrx-store.workspace = true
cgrx-metrics.workspace = true
blake3.workspace = true
levenshtein = "1.0.5"
serde.workspace = true
serde_json.workspace = true
notify = "8.2.0"
protobuf = "=3.7.2"
scip = "=0.10.0"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[[test]]
name = "multi_repo"
path = "../../tests/multi_repo.rs"

[features]
# Validation-only opt-in; never enabled by a default or release build.
experimental-php = ["cgrx-languages/experimental-php"]

[package]
name = "cgrx-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
zstd = "0.14.0"
cgrx-core.workspace = true
cgrx-languages.workspace = true
serde.workspace = true
serde_json.workspace = true
memvid-core = { version = "=2.0.140", default-features = false, features = ["lex", "vec"] }
# Shares Memvid's pinned ONNX Runtime; newer FastEmbed releases use a different ABI.
fastembed = { version = "=5.8.0", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }

[[test]]
name = "crash_injection"
path = "../../tests/crash_injection.rs"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"

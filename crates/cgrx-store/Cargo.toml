[package]
name = "cgrx-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.2"
zstd = "0.14.0"
cgrx-core = { path = "../cgrx-core" }
cgrx-languages = { path = "../cgrx-languages" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
memvid-core = { version = "=2.0.140", default-features = false, features = ["lex", "vec"] }
# Shares Memvid's pinned ONNX Runtime; newer FastEmbed releases use a different ABI.
fastembed = { version = "=5.2.0", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }

[[test]]
name = "crash_injection"
path = "../../tests/crash_injection.rs"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"

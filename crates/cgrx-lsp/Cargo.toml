[package]
name = "cgrx-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cgrx-lsp"
path = "src/main.rs"

[dependencies]
cgrx-core = { path = "../cgrx-core" }
cgrx-languages = { path = "../cgrx-languages" }
cgrx-retrieval = { path = "../cgrx-retrieval" }
cgrx-store = { path = "../cgrx-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
serde_json = "1.0.143"
